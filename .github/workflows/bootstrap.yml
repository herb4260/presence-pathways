name: bootstrap-project

on:
  push:
    branches:
      - upload-project-files

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/presence-project
          python - <<'PY'
          from pathlib import Path
          import base64, re
          out = bytearray()
          for p in sorted(Path('.bootstrap').glob('part-*.b64')):
              s = p.read_text(encoding='utf-8')
              s = s.replace('\\n','').replace('\\r','')
              s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
              s += '=' * ((4 - len(s) % 4) % 4)
              out.extend(base64.b64decode(s, validate=False))
          Path('/tmp/project.zip').write_bytes(out)
          PY
          echo "7a62b82c8cce886f2a228113205cb4721040f8f5314d17a583ebbccf41cd3f8d  /tmp/project.zip" | sha256sum -c -
          unzip -q /tmp/project.zip -d /tmp/presence-project
          rm -rf data docs instruments results scripts src tests .github
          rm -f .gitignore CITATION.cff CONTRIBUTING.md LICENSE PROJECT_OVERVIEW.md README.md README_KO.md pyproject.toml
          cp -a /tmp/presence-project/. .
          mkdir -p tests
          mv .github/workflows/tests.yml tests/ci_workflow.yml
          rm -rf .github .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .gitignore CITATION.cff CONTRIBUTING.md LICENSE PROJECT_OVERVIEW.md README.md README_KO.md data docs instruments pyproject.toml results scripts src tests
          git add -u -- .bootstrap .github/workflows/bootstrap.yml
          git commit -m "Upload Presence Pathways project"
          git push origin HEAD:upload-project-files

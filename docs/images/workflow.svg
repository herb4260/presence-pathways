<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#fbfdfc"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#123b4a}.h{font-family:Georgia,serif;font-weight:700;fill:#123b4a}.m{fill:#47727b}.card{fill:#fff;stroke:#d7e5e6;stroke-width:2}.teal{fill:#147c82}.green{fill:#4f7d43}.pale{fill:#eaf5f3}.grid{stroke:#d9e4e5;stroke-width:1;stroke-dasharray:4 5}</style><text x="48" y="72" font-size="48" class="h">Project Workflow</text><text x="50" y="108" font-size="20" class="m">Mixed-methods prototype from question to reproducible outputs</text><rect x="42" y="180" rx="18" width="215" height="360" class="card"/><circle cx="74" cy="215" r="20" class="teal"/><text x="67" y="222" font-size="20" fill="white" font-family="Arial">1</text><text x="62" y="285" font-size="23" class="h">Research Question</text><line x1="62" y1="305" x2="237" y2="305" stroke="#d7e5e6"/><text x="62" y="345" font-size="16" class="m">Felt presence and healing over time</text><path d="M 262 360 L 280 360 L 272 350 M 280 360 L 272 370" stroke="#147c82" stroke-width="4" fill="none"/><rect x="287" y="180" rx="18" width="215" height="360" class="card"/><circle cx="319" cy="215" r="20" class="teal"/><text x="312" y="222" font-size="20" fill="white" font-family="Arial">2</text><text x="307" y="285" font-size="23" class="h">21-Day EMA</text><line x1="307" y1="305" x2="482" y2="305" stroke="#d7e5e6"/><text x="307" y="345" font-size="16" class="m">36 synthetic participants · 672 observations</text><path d="M 507 360 L 525 360 L 517 350 M 525 360 L 517 370" stroke="#147c82" stroke-width="4" fill="none"/><rect x="532" y="180" rx="18" width="215" height="360" class="card"/><circle cx="564" cy="215" r="20" class="teal"/><text x="557" y="222" font-size="20" fill="white" font-family="Arial">3</text><text x="552" y="285" font-size="23" class="h">Phenomenological Excerpts</text><line x1="552" y1="305" x2="727" y2="305" stroke="#d7e5e6"/><text x="552" y="345" font-size="16" class="m">Synthetic interview excerpts · bilingual guide</text><path d="M 752 360 L 770 360 L 762 350 M 770 360 L 762 370" stroke="#147c82" stroke-width="4" fill="none"/><rect x="777" y="180" rx="18" width="215" height="360" class="card"/><circle cx="809" cy="215" r="20" class="teal"/><text x="802" y="222" font-size="20" fill="white" font-family="Arial">4</text><text x="797" y="285" font-size="23" class="h">Integrated Analysis</text><line x1="797" y1="305" x2="972" y2="305" stroke="#d7e5e6"/><text x="797" y="345" font-size="16" class="m">Within-person associations · qualitative coding</text><path d="M 997 360 L 1015 360 L 1007 350 M 1015 360 L 1007 370" stroke="#147c82" stroke-width="4" fill="none"/><rect x="1022" y="180" rx="18" width="215" height="360" class="card"/><circle cx="1054" cy="215" r="20" class="teal"/><text x="1047" y="222" font-size="20" fill="white" font-family="Arial">5</text><text x="1042" y="285" font-size="23" class="h">Outputs</text><line x1="1042" y1="305" x2="1217" y2="305" stroke="#d7e5e6"/><text x="1042" y="345" font-size="16" class="m">Dashboard · JSON · scripts · GitHub Pages</text><rect x="250" y="590" rx="14" width="340" height="70" class="pale"/><text x="275" y="622" font-size="18" class="h">No real participant data</text><text x="275" y="647" font-size="15" class="m">This is a synthetic data prototype.</text><rect x="690" y="590" rx="14" width="340" height="70" fill="#eef6e9"/><text x="715" y="622" font-size="18" class="green">Exploratory, not diagnostic</text><text x="715" y="647" font-size="15" class="m">For research learning and tool development.</text></svg>